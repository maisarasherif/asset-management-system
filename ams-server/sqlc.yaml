version: "2"
sql:
  - engine: "postgresql"
    queries: "./db/queries/"
    schema: "./db/migrations/"
    gen:
      go:
        package: "db"
        out: "./db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
        - db_type: "uuid"
          go_type:
            import: "github.com/google/uuid"
            type: "UUID"
        - db_type: "uuid"
          nullable: true
          go_type:
            import: "github.com/google/uuid"
            type: "UUID"
            pointer: true
        - column: "certificates.issue_date"
          go_type:
            type: "time.Time"
            pointer: true
        - column: "certificates.expiry_date"
          go_type:
            type: "time.Time"
            pointer: true
        - column: "test_types.validity_duration"
          go_type:
            type: "int32"
            pointer: true
        - column: "certificates.created_at"
          go_type: "time.Time"
        - column: "certificates.updated_at"
          go_type: "time.Time"
        - column: "assets.created_at"
          go_type: "time.Time"
